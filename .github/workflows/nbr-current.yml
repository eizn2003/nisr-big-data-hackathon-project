name: NBR Current Snapshot

on:
  schedule:
    - cron: "17 12 * * 2"
    - cron: "0 15 * * 2"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: nbr-current-snapshot
  cancel-in-progress: false

jobs:
  backup-check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Check for a successful earlier scheduled run
        id: check
        if: github.event_name == 'schedule' && github.event.schedule == '0 15 * * 2'
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "nbr-current.yml",
              branch: context.ref_name,
              event: "schedule",
              per_page: 100,
            });
            const succeeded = data.workflow_runs.some((run) =>
              run.id !== context.runId &&
              run.status === "completed" &&
              run.conclusion === "success" &&
              run.created_at.startsWith(`${today}T`)
            );
            core.setOutput("skip", String(succeeded));
            if (succeeded) {
              core.info("The earlier scheduled scrape succeeded today; skipping the backup run.");
            } else {
              core.info("No successful scheduled scrape found today; proceeding with the backup run.");
            }

  scrape:
    needs: backup-check
    if: needs.backup-check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-dotenv pymongo playwright

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Run NBR current snapshot
        run: |
          python src/scrapers/scrape_nbr_current.py \
            --all-pages \
            --config config/nbr_pages.json
